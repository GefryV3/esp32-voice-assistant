mark_reminder_done:
  name: Отметить напоминание выполненным
  description: >-
    Помечает напоминание в memory.json как выполненное (done: true), чтобы оно
    больше не озвучивалось. Вызывается автоматизацией "проверка напоминаний"
    после успешного announce или отправки в Telegram.
  fields:
    text:
      name: Текст напоминания
      description: Точный текст напоминания, как он хранится в памяти.
      required: true
      example: "сдать домашку по матеше"
      selector:
        text:

compact_history:
  name: Компакция истории разговоров
  description: >-
    Просит Gemini свернуть накопленные за день реплики в краткую сводку
    (conversation_summary в memory.json) и очищает историю в оперативной
    памяти. Вызывается ежедневной автоматизацией ночью.
