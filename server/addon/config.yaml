# Локальный аддон Home Assistant. Сюда не копировать руками — tools/deploy_addon.py
# собирает папку аддона (этот файл, Dockerfile, пакет jarvis, токен) и кладёт её в
# \\<HA>\addons\jarvis. Версию подставляет скрипт из jarvis.__version__.
name: Jarvis
version: "0.0.0"
slug: jarvis
description: Сервер голосового ассистента Jarvis — колонка, телефон и компьютер
arch:   # armv7 нет: под него нет onnxruntime
  - amd64
  - aarch64
startup: application
boot: auto
ports:
  8765/tcp: 8765
ports_description:
  8765/tcp: колонка, телефон и компьютер (WebSocket)
homeassistant_api: true   # токен SUPERVISOR_TOKEN и ws://supervisor/core/websocket
watchdog: tcp://[HOST]:[PORT:8765]
options: {}
schema: {}
