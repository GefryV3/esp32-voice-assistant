name: Android

on:
  push:
    branches: [main]
    paths: ["phone/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["phone/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Gradle assembleDebug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build
        run: gradle -p phone assembleDebug --no-daemon
