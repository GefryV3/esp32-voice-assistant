name: Firmware

on:
  push:
    branches: [main]
    paths: ["firmware/**", ".github/workflows/firmware.yml"]
  pull_request:
    paths: ["firmware/**", ".github/workflows/firmware.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ESP-IDF build · esp32s3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Placeholder secrets
        run: cp firmware/main/secrets.h.example firmware/main/secrets.h

      - name: Build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.5
          target: esp32s3
          path: firmware
          command: idf.py build && idf.py size
