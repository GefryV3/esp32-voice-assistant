name: Feature idea
description: Suggest something the assistant could do
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What should it do, and in which situation would you use it?
    validations:
      required: true
  - type: textarea
    id: why-voice
    attributes:
      label: Why on the speaker?
      description: The speaker only does what is inconvenient to do on a phone. Why does this belong here?
