name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: dropdown
    id: part
    attributes:
      label: Part of the project
      options: [Server, Firmware, Android app, PC agent, Docs]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Server log, serial output or logcat. Remove tokens and keys before pasting.
      render: text
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: "server 0.13.0, firmware 0.6.0, app 0.3.0"
