<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" width="960" height="530" role="img"
     aria-label="Architecture: the ESP32-S3 speaker, Android app, PC agent and Telegram connect to the Python brain, which talks to Gemini Live, Home Assistant and web services">
<defs>
  <marker id="ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#58a6ff"/></marker>
  <marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#58a6ff"/></marker>
  <marker id="ce" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6e7681"/></marker>
  <marker id="cs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6e7681"/></marker>
</defs>
<style>
  text { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif; text-anchor: middle; }
  .t { font-size: 15px; font-weight: 600; fill: #e6edf3; }
  .g { font-size: 17px; font-weight: 700; fill: #e6edf3; }
  .s { font-size: 12.5px; fill: #9198a1; }
  .p { font-size: 12.5px; fill: #e6edf3; }
  .st { text-anchor: start; }
  .l { font-size: 12px; fill: #9198a1; font-style: italic; }
  .ea { fill: none; stroke: #58a6ff; stroke-width: 2; }
  .ec { fill: none; stroke: #6e7681; stroke-width: 1.5; stroke-dasharray: 5 4; }
</style>
<rect x="20" y="20" width="250" height="250" rx="16" fill="#0d1117" stroke="#3d444d"/>
<text x="40" y="50" class="g st">Speaker</text>
<text x="40" y="69" class="s st">ESP32-S3 · C++17 · ESP-IDF 5.5</text>
<rect x="40" y="92" width="210" height="28" rx="14" fill="#21262d" stroke="#30363d"/><text x="145.0" y="110.5" class="p">INMP441 microphone</text>
<rect x="40" y="130" width="210" height="28" rx="14" fill="#21262d" stroke="#30363d"/><text x="145.0" y="148.5" class="p">MAX98357A amplifier</text>
<rect x="40" y="168" width="210" height="28" rx="14" fill="#21262d" stroke="#30363d"/><text x="145.0" y="186.5" class="p">GC9A01 round display</text>
<rect x="40" y="206" width="210" height="28" rx="14" fill="#21262d" stroke="#30363d"/><text x="145.0" y="224.5" class="p">face engine · 60 fps</text>
<rect x="20" y="300" width="250" height="58" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="145.0" y="325.0" class="t">Android app</text>
<text x="145.0" y="342.0" class="s">Kotlin · Jetpack Compose</text>
<rect x="20" y="376" width="250" height="58" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="145.0" y="401.0" class="t">PC agent</text>
<text x="145.0" y="418.0" class="s">presence · battery · links</text>
<rect x="20" y="452" width="250" height="58" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="145.0" y="477.0" class="t">Telegram bot</text>
<text x="145.0" y="494.0" class="s">same conversation as voice</text>
<rect x="340" y="20" width="290" height="490" rx="16" fill="#0d1117" stroke="#3d444d"/>
<text x="360" y="50" class="g st">Brain</text>
<text x="360" y="69" class="s st">Python · asyncio · Home Assistant add-on</text>
<rect x="365" y="84" width="240" height="56" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="485.0" y="108.0" class="t">Device hub</text>
<text x="485.0" y="125.0" class="s">WebSocket · OTA · screen</text>
<rect x="365" y="172" width="240" height="56" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="485.0" y="196.0" class="t">Wake word</text>
<text x="485.0" y="213.0" class="s">custom Russian word · Vosk</text>
<rect x="365" y="260" width="240" height="56" rx="10" fill="#0c2d6b" stroke="#58a6ff" stroke-width="1.5"/>
<text x="485.0" y="284.0" class="t">Voice session</text>
<text x="485.0" y="301.0" class="s">streaming · barge-in</text>
<rect x="365" y="348" width="240" height="140" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="485.0" y="423.0" class="t"></text>
<text x="485" y="376" class="t">Tools &amp; memory</text>
<text x="485" y="400" class="s">reminders · timers · lights</text>
<text x="485" y="418" class="s">calendar · mail · tasks</text>
<text x="485" y="436" class="s">search agents · routines</text>
<text x="485" y="454" class="s">presence · learning</text>
<text x="485" y="472" class="s">plug-in skills</text>
<text x="720" y="44" class="g st">Legend</text>
<path d="M720 66 h44" class="ea" marker-end="url(#ae)"/>
<text x="774" y="70" class="s st">audio stream (PCM)</text>
<path d="M720 92 h44" class="ec" marker-end="url(#ce)"/>
<text x="774" y="96" class="s st">commands · data</text>
<text x="720" y="128" class="s st">Every device keeps one WebSocket</text>
<text x="720" y="146" class="s st">to the hub: JSON text frames for</text>
<text x="720" y="164" class="s st">commands, binary frames for audio.</text>
<text x="720" y="198" class="s st">The speaker stays usable offline:</text>
<text x="720" y="216" class="s st">clock, alarms, timers and claps</text>
<text x="720" y="234" class="s st">run on the device itself.</text>
<rect x="700" y="260" width="240" height="56" rx="10" fill="#0c2d6b" stroke="#58a6ff" stroke-width="1.5"/>
<text x="820.0" y="284.0" class="t">Gemini Live API</text>
<text x="820.0" y="301.0" class="s">speech ⇄ speech, tools</text>
<rect x="700" y="352" width="240" height="56" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="820.0" y="376.0" class="t">Home Assistant</text>
<text x="820.0" y="393.0" class="s">lights · sensors · presence</text>
<rect x="700" y="432" width="240" height="56" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="820.0" y="456.0" class="t">Web services</text>
<text x="820.0" y="473.0" class="s">Google · search · weather · transit</text>
